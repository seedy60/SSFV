; SFAccess Native settings. The file lives beside xinput1_3.dll.
[general]
; Menu narration, on when the game starts.
narration=1

; How often the screen is read, in milliseconds.
poll_ms=80

; How often Scaleform's heap is swept for newly created text fields.
; Lower is faster to notice a new screen and costs more CPU.
scan_ms=400

; How long a changed selection must stay unchanged before it is spoken. A
; prompt's question gets a longer settle the first time it appears.
announce_delay_ms=80

; SAPI voice rate, -10 to 10. Ignored when Prism is used.
speech_rate=0

; Keep reading while the game is in the background. Off means hotkeys keep
; working and speech stops when you switch away.
narrate_in_background=0

; Write every field of every announcement to the log. For diagnosis only.
log_fields=0

; Read long descriptive blurbs, such as the Arcade path stories.
; Off by default.
read_blurbs=0

[radar]
; The character radar is a short pulse that pans to the opponent's side,
; rises in pitch while they are above you, and quickens as they get closer.
; It runs during a round, not in menus, and can be toggled with Ctrl+Shift+P.
; Ctrl+Shift+D speaks the opponent's side, height and distance on demand.
enabled=1

; Pulse loudness, 0 to 100.
volume=35

; World units from one side of the stage to the other. Larger makes the
; pulses quicken more slowly as the opponent closes in.
range=1800

; Height difference, in world units, at which the pitch has risen most of
; the way to its top note.
height=220

; Pulse interval at point-blank range and at full range, in milliseconds.
near_ms=120
far_ms=650

; Pulse pitch at the opponent's height, in hertz.
base_hz=520

[macros]
; Macros send the game ordinary keyboard input. They assume Street Fighter V's
; default keyboard layout: WASD to move, G/H/J for punches, B/N/M for kicks.
; Use them offline; a match with other players may treat injected input as
; cheating.
enabled=1

; All three keys are pressed with Ctrl+Shift.
critical_key=F1
vskill_key=F2
vtrigger_key=F3

; One direction step, in milliseconds. 34 is about two frames at 60 FPS.
step_ms=34

; How long a move in square brackets is held, for charge moves.
hold_ms=1000

; Defaults for characters without their own section. A Critical Art needs the
; character section; V-Skill and V-Trigger are the same input for everyone.
vskill=MP+MK
vtrigger=HP+HK
critical=

; A section is [macros.<name>] using the name on the health bar. Directions
; are numpad directions relative to facing right, 1 to 9: 236 is quarter-circle
; forward, 214 is quarter-circle back, [4]6 is charge back then forward.
; 720 means two full rotations, for Zangief. P means heavy punch, K means heavy
; kick; LP/MP/HP and LK/MK/HK are exact.
; Eleven copies the opponent and has no fixed Critical Art input.
